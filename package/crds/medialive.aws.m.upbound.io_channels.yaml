                                      description: How to handle the gap between the
                                        lines in multi-line captions. enabled fills
                                        the gap with the captions background color
                                        as specified in the input captions; disabled
                                        leaves the gap unfilled.
                                      type: string
                                    fontFamily:
                                      description: Font family to include in the font
                                        data attached to the EBU-TT captions. Valid
                                        only if style_control is set to include. If
                                        you leave this field empty, the font family
                                        is set to monospaced. You specify only the
                                        font family; all other style information (color,
                                        bold, position, and so on) is copied from
                                        the input captions, and the size is always
                                        set to 100% to allow the downstream player
