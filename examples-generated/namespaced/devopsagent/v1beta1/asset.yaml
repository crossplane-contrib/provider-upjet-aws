apiVersion: devopsagent.aws.m.upbound.io/v1beta1
kind: Asset
metadata:
  annotations:
    meta.upbound.io/example-id: devopsagent/v1beta1/asset
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    agentSpaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    assetType: agents_md
    content:
      file:
        body:
          text: Follow the operational runbook.
        path: AGENTS.md
    metadata: ${jsonencode({ agent_type = "GENERIC" })}
    region: us-west-1

---

apiVersion: devopsagent.aws.m.upbound.io/v1beta1
kind: AgentSpace
metadata:
  annotations:
    meta.upbound.io/example-id: devopsagent/v1beta1/asset
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    name: example
    region: us-west-1
