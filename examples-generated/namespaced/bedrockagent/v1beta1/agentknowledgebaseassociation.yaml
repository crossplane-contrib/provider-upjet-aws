apiVersion: bedrockagent.aws.m.upbound.io/v1beta1
kind: AgentKnowledgeBaseAssociation
metadata:
  annotations:
    meta.upbound.io/example-id: bedrockagent/v1beta1/agentknowledgebaseassociation
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    agentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Example Knowledge base
    knowledgeBaseIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    knowledgeBaseState: ENABLED
    region: us-west-1
