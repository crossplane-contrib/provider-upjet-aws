apiVersion: oam.aws.m.upbound.io/v1beta1
kind: Link
metadata:
  annotations:
    meta.upbound.io/example-id: oam/v1beta1/link
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    labelTemplate: $AccountName
    region: us-west-1
    resourceTypes:
    - AWS::CloudWatch::Metric
    sinkIdentifierSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    tags:
      Env: prod

---

apiVersion: oam.aws.m.upbound.io/v1beta1
kind: Sink
metadata:
  annotations:
    meta.upbound.io/example-id: oam/v1beta1/link
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1

---

apiVersion: oam.aws.m.upbound.io/v1beta1
kind: SinkPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: oam/v1beta1/link
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    sinkIdentifierSelector:
      matchLabels:
        testing.upbound.io/example-name: example
