apiVersion: shield.aws.m.upbound.io/v1beta1
kind: ProtectionHealthCheckAssociation
metadata:
  annotations:
    meta.upbound.io/example-id: shield/v1beta1/protectionhealthcheckassociation
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    healthCheckArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    shieldProtectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: EIP
metadata:
  annotations:
    meta.upbound.io/example-id: shield/v1beta1/protectionhealthcheckassociation
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    domain: vpc
    tags:
      Name: example

---

apiVersion: route53.aws.m.upbound.io/v1beta1
kind: HealthCheck
metadata:
  annotations:
    meta.upbound.io/example-id: shield/v1beta1/protectionhealthcheckassociation
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    failureThreshold: "3"
    ipAddress: ${aws_eip.example.public_ip}
    port: 80
    requestInterval: "30"
    resourcePath: /ready
    tags:
      Name: tf-example-health-check
    type: HTTP

---

apiVersion: shield.aws.m.upbound.io/v1beta1
kind: Protection
metadata:
  annotations:
    meta.upbound.io/example-id: shield/v1beta1/protectionhealthcheckassociation
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    name: example-protection
    resourceArnSelector:
      matchLabels:
        testing.upbound.io/example-name: aws_partition
