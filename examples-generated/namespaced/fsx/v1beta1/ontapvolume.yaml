apiVersion: fsx.aws.m.upbound.io/v1beta1
kind: OntapVolume
metadata:
  annotations:
    meta.upbound.io/example-id: fsx/v1beta1/ontapvolume
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: upbound-system
spec:
  forProvider:
    junctionPath: /test
    name: test
    region: us-west-1
    sizeInMegabytes: 1024
    storageEfficiencyEnabled: true
    storageVirtualMachineIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
