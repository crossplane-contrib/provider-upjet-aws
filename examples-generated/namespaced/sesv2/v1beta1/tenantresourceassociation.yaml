apiVersion: sesv2.aws.m.upbound.io/v1beta1
kind: TenantResourceAssociation
metadata:
  annotations:
    meta.upbound.io/example-id: sesv2/v1beta1/tenantresourceassociation
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    resourceArn: arn:aws:ses:us-east-1:123456789012:configuration-set/example
    tenantNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
