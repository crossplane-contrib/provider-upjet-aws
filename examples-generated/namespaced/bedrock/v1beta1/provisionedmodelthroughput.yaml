apiVersion: bedrock.aws.m.upbound.io/v1beta1
kind: ProvisionedModelThroughput
metadata:
  annotations:
    meta.upbound.io/example-id: bedrock/v1beta1/provisionedmodelthroughput
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    commitmentDuration: SixMonths
    modelArn: arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-v2
    modelUnits: 1
    provisionedModelName: example-model
    region: us-west-1
