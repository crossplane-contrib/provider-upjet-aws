apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: TableBucketReplication
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablebucketreplication
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    rule:
      destination:
      - destinationTableBucketArnSelector:
          matchLabels:
            testing.upbound.io/example-name: target
    tableBucketArnSelector:
      matchLabels:
        testing.upbound.io/example-name: source
