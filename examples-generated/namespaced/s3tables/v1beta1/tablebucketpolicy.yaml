apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: TableBucketPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablebucketpolicy
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    resourcePolicy: ${data.aws_iam_policy_document.example.json}
    tableBucketArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: TableBucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablebucketpolicy
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    name: example-bucket
    region: us-west-1
