apiVersion: shield.aws.upbound.io/v1beta1
kind: Protection
metadata:
  annotations:
    meta.upbound.io/example-id: shield/v1beta1/protection
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: example
    resourceArnSelector:
      matchLabels:
        testing.upbound.io/example-name: aws_region
    tags:
      Environment: Dev

---

apiVersion: ec2.aws.upbound.io/v1beta1
kind: EIP
metadata:
  annotations:
    meta.upbound.io/example-id: shield/v1beta1/protection
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    domain: vpc
