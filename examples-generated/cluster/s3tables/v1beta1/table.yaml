apiVersion: s3tables.aws.upbound.io/v1beta1
kind: Table
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/table
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    format: ICEBERG
    name: example_table
    namespaceSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    region: us-west-1
    tableBucketArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: s3tables.aws.upbound.io/v1beta1
kind: S3TablesNamespace
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/table
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    namespace: example_namespace
    region: us-west-1
    tableBucketArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: s3tables.aws.upbound.io/v1beta1
kind: TableBucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/table
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: example-bucket
    region: us-west-1
