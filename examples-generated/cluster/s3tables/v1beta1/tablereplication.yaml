apiVersion: s3tables.aws.upbound.io/v1beta1
kind: TableReplication
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablereplication
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    region: us-west-1
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    rule:
    - destination:
      - destinationTableBucketArnSelector:
          matchLabels:
            testing.upbound.io/example-name: target
    tableArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example
