apiVersion: opensearch.aws.upbound.io/v1beta1
kind: VPCEndpoint
metadata:
  annotations:
    meta.upbound.io/example-id: opensearch/v1beta1/vpcendpoint
  labels:
    testing.upbound.io/example-name: foo
  name: foo
spec:
  forProvider:
    domainArnSelector:
      matchLabels:
        testing.upbound.io/example-name: domain_1
    region: us-west-1
    vpcOptions:
      securityGroupIdsRefs:
      - name: test
      - name: test2
      subnetIdsRefs:
      - name: test
      - name: test2
