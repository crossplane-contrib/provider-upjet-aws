apiVersion: cloudwatchlogs.aws.upbound.io/v1beta1
kind: DeliveryDestinationPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: cloudwatchlogs/v1beta1/deliverydestinationpolicy
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    deliveryDestinationNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    deliveryDestinationPolicy: ${data.aws_iam_policy_document.example.json}
    region: us-west-1
