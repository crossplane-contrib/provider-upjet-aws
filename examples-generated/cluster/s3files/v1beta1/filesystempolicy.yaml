apiVersion: s3files.aws.upbound.io/v1beta1
kind: FileSystemPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: s3files/v1beta1/filesystempolicy
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    fileSystemIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    policy: |-
      ${jsonencode({
          Version = "2012-10-17"
          Statement = [
            {
              Effect = "Allow"
              Principal = {
                AWS = "arn:${data.aws_partition.current.partition}:iam::${data.aws_caller_identity.current.account_id}:root"
              }
              Action   = "s3files:ClientMount"
              Resource = "*"
            }
          ]
        })}
    region: us-west-1
