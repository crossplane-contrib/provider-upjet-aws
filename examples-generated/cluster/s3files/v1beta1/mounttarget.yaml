apiVersion: s3files.aws.upbound.io/v1beta1
kind: MountTarget
metadata:
  annotations:
    meta.upbound.io/example-id: s3files/v1beta1/mounttarget
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    fileSystemIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    region: us-west-1
    subnetIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
