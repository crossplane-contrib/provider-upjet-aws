apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: e2etestclusters.aws.platformref.upbound.io
spec:
  defaultCompositeDeletePolicy: Foreground
  group: aws.platformref.upbound.io
  names:
    kind: E2ETestCluster
    plural: e2etestclusters
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  description: Cluster configuration parameters.
                  properties:
                    id:
                      type: string
                      description: ID of this Cluster that other objects will use to refer to it.
                    region:
                      type: string
                      description: Region is the region you'd like your resource to be created in.
                    accessConfig:
                      type: object
                      properties:
                        bootstrapClusterCreatorAdminPermissions:
                          type: boolean
                          description: Whether or not to bootstrap the access config values to the cluster. Default is false.
                        authenticationMode:
                          type: string
                          enum:
                            - CONFIG_MAP
                            - API
                            - API_AND_CONFIG_MAP
                      default:
                        bootstrapClusterCreatorAdminPermissions: true
                        authenticationMode: API_AND_CONFIG_MAP
                    iam:
                      type: object
                      description: IAM configuration to connect as ClusterAdmin.
                      properties:
                        principalArn:
                          description: The principal ARN to connect as ClusterAdmin.
                          type: string
                    managementPolicies:
                      description: ManagementPolicies for AWS EC2 resources. Defaults to ["*"] which includes all operations (Create, Observe, Update, Delete, LateInitialize). To orphan resources on deletion, use ["Create", "Observe", "Update", "LateInitialize"].
                      type: array
                      items:
                        type: string
                        enum:
                          - "*"
                          - Create
                          - Observe
                          - Update
                          - Delete
                          - LateInitialize
                        default: "*"
                    networkSelector:
                      description: Value of the "type" label used to select which Network Composition backs this cluster's network. When unset, the default Composition for the Network XR is used.
                      type: string
                    providerConfigName:
                      description: Crossplane ProviderConfig to use for provisioning this resources
                      type: string
                      default: default
                    providerConfigKind:
                      description: Crossplane ProviderConfig's kind to use for provisioning this resources
                      type: string
                      default: ProviderConfig
                    version:
                      type: string
                      description: Kubernetes version of the Cluster
                      enum:
                        - "1.36"
                        - "1.35"
                        - "1.34"
                      default: "1.35"
                    nodes:
                      type: object
                      description: EKS node configuration parameters.
                      properties:
                        count:
                          type: integer
                          description: Desired node count, from 1 to 100.
                        instanceType:
                          type: string
                          description: instance types associated with the Node Group.
                          default: t3.small
                      required:
                        - count
                        - instanceType
                    irsa:
                      type: object
                      description: IRSA configuration parameters.
                      properties:
                        serviceAccount:
                          type: object
                          description: Configuration for SA
                          properties:
                            name:
                              type: string
                              description: name kubernetes SA
                            namespace:
                              type: string
                              description: namespace kubernetes SA
                          required:
                            - name
                            - namespace
                        condition:
                          type: string
                          description: This is the whether or not the equals is a hard match or like query
                          default: StringEquals
                          enum:
                            - StringEquals
                            - StringLike
                        policyDocument:
                          type: string
                          description: The JSON policy document that is the content for the policy.
                      required:
                        - condition
                        - policyDocument
                        - serviceAccount
                    targetClusterParameters:
                      type: object
                      description: Target EKS Cluster configuration parameters.
                      properties:
                        provider:
                          type: object
                          description: Configuration for providers to be installed
                          properties:
                            familyPackage:
                              type: string
                              description: provider-family-aws package url to be used
                            ec2Package:
                              type: string
                              description: provider-aws-ec2 package url to be used
                            rdsPackage:
                              type: string
                              description: provider-aws-iam package url to be used
                            kafkaPackage:
                              type: string
                              description: provider-aws-kafka package url to be used
                          required:
                            - familyPackage
                            - ec2Package
                            - rdsPackage
                            - kafkaPackage
                        crossplaneVersion:
                          type: string
                          description: crossplane version to be deployed on the cluster
                          default: "2.4.0"
                      required:
                        - crossplaneVersion
                        - provider
                  required:
                    - id
                    - nodes
                    - providerConfigName
                    - providerConfigKind
                    - region
                    - irsa
                    - targetClusterParameters
              required:
                - parameters
            status:
              type: object
              properties:
                subnetIds:
                  type: array
                  items:
                    type: string
                eks:
                  x-kubernetes-preserve-unknown-fields: true
                  type: object
                eksOIDC:
                  x-kubernetes-preserve-unknown-fields: true
                  type: object
                irsa:
                  type: object
                  properties:
                    roleArn:
                      type: string
                    policyArn:
                      type: string
                    chainedRoleARNs:
                      type: array
                      items:
                        type: string
                    observed:
                      x-kubernetes-preserve-unknown-fields: true
                      type: object
                webIdentity:
                  type: object
                  properties:
                    roleArn:
                      type: string
                    policyArn:
                      type: string
                    chainedRoleARNs:
                      type: array
                      items:
                        type: string
                podIdentity:
                  type: object
                  properties:
                    roleArn:
                      type: string
