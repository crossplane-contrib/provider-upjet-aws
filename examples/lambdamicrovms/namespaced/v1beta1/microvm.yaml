# MicroVM Example
# Runs a Lambda MicroVM from a MicroVM image, which is suspended when it is
# idle and terminated at the end of its maximum duration.
# The import step of uptest is skipped until crossplane/upjet#766 is released:
# after a provider restart the unset cloudwatch block of logging is rebuilt as
# a set block, and removing it again would replace the MicroVM.

apiVersion: lambdamicrovms.aws.m.upbound.io/v1beta1
kind: MicroVM
metadata:
  annotations:
    meta.upbound.io/example-id: lambdamicrovms/v1beta1/microvm
  labels:
    testing.upbound.io/example-name: microvm
  name: microvm
  namespace: upbound-system
spec:
  forProvider:
    idlePolicy:
      autoResumeEnabled: true
      maxIdleDurationSeconds: 900
      suspendedDurationSeconds: 1800
    imageArnSelector:
      matchLabels:
        testing.upbound.io/example-name: microvm
    logging:
      disabled: {}
    maximumDurationInSeconds: 3600
    region: us-east-1

---

apiVersion: lambdamicrovms.aws.m.upbound.io/v1beta1
kind: Image
metadata:
  annotations:
    meta.upbound.io/example-id: lambdamicrovms/v1beta1/microvm
  labels:
    testing.upbound.io/example-name: microvm
  name: microvm
  namespace: upbound-system
spec:
  forProvider:
    baseImageArn: arn:aws:lambda:us-east-1:aws:microvm-image:al2023-1
    buildRoleArnSelector:
      matchLabels:
        testing.upbound.io/example-name: microvm
    codeArtifact:
      uriSelector:
        matchLabels:
          testing.upbound.io/example-name: microvm
    description: Example MicroVM image
    name: example-microvm
    region: us-east-1

---

apiVersion: s3.aws.m.upbound.io/v1beta1
kind: Object
metadata:
  annotations:
    meta.upbound.io/example-id: lambdamicrovms/v1beta1/microvm
  labels:
    testing.upbound.io/example-name: microvm
  name: microvm
  namespace: upbound-system
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: microvm
    # a zip archive with a Dockerfile and the main.go it builds at its root
    contentBase64: 
    contentType: application/zip
    key: code.zip
    region: us-east-1

---

apiVersion: s3.aws.m.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: lambdamicrovms/v1beta1/microvm
  labels:
    testing.upbound.io/example-name: microvm
  name: ${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    forceDestroy: true
    region: us-east-1

---

apiVersion: iam.aws.m.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: lambdamicrovms/v1beta1/microvm
  labels:
    testing.upbound.io/example-name: microvm
  name: example-lambdamicrovms-microvm
  namespace: upbound-system
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "lambda.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }

---

apiVersion: iam.aws.m.upbound.io/v1beta1
kind: RolePolicy
metadata:
  annotations:
    meta.upbound.io/example-id: lambdamicrovms/v1beta1/microvm
  labels:
    testing.upbound.io/example-name: microvm
  name: example-lambdamicrovms-microvm
  namespace: upbound-system
spec:
  forProvider:
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:GetObject"
            ],
            "Resource": "arn:aws:s3:::*/code.zip"
          }
        ]
      }
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: microvm
