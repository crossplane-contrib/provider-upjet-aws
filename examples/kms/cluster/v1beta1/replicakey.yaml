apiVersion: kms.aws.upbound.io/v1beta1
kind: ReplicaKey
metadata:
  annotations:
    meta.upbound.io/example-id: kms/v1beta1/replicakey
  name: example
spec:
  forProvider:
    region: us-east-2
    description: "Multi-Region replica key"
    deletionWindowInDays: 7
    primaryKeyArnRef:
      name: sample-replicakey

---
apiVersion: kms.aws.upbound.io/v1beta1
kind: Key
metadata:
  annotations:
    meta.upbound.io/example-id: kms/v1beta1/replicakey
  name: sample-replicakey
spec:
  forProvider:
    region: us-east-1
    description: Created with Crossplane
    multiRegion: true
    deletionWindowInDays: 7
