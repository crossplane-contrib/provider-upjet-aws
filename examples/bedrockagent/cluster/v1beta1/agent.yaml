apiVersion: bedrockagent.aws.upbound.io/v1beta1
kind: Agent
metadata:
  annotations:
    meta.upbound.io/example-id: bedrockagent/v1beta1/agent
    upjet.upbound.io/manual-intervention: >
      creating Bedrock Agent: operation error Bedrock Agent: CreateAgent,
      https response error StatusCode: 403, RequestID: uuid,
      AccessDeniedException: Bedrock Agents is in Maintenance Mode. New agent
      creation is not available for accounts without prior service usage. To
      learn more visit
      https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html.
  labels:
    testing.upbound.io/example-name: example-bedrockagent-model
  name: example
spec:
  forProvider:
    agentName: example
    instruction: an example instruction that is required to pass
    agentResourceRoleArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example-bedrockagent-model
    foundationModel: anthropic.claude-v2
    idleSessionTtlInSeconds: 500
    region: us-east-1

---

apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: bedrockagent/v1beta1/agent
  labels:
    testing.upbound.io/example-name: example-bedrockagent-model
  name: example-bedrockagent-model
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "bedrock.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }

---

apiVersion: iam.aws.upbound.io/v1beta1
kind: RolePolicy
metadata:
  annotations:
    meta.upbound.io/example-id: bedrockagent/v1beta1/agent
  labels:
    testing.upbound.io/example-name: example-bedrockagent-model
  name: example-bedrockagent-model
spec:
  forProvider:
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "bedrock:InvokeModel"
            ],
            "Resource": "*"
          }
        ]
      }
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: example-bedrockagent-model
