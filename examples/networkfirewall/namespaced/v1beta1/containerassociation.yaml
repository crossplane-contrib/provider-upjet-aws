apiVersion: networkfirewall.aws.m.upbound.io/v1beta1
kind: ContainerAssociation
metadata:
  annotations:
    meta.upbound.io/example-id: networkfirewall/v1beta1/containerassociation
    uptest.upbound.io/timeout: "2400"
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    containerAssociationName: example-eks-association
    containerMonitoringConfiguration:
      - clusterArnRef:
          name: sample-eks-cluster
        attributeFilter:
          - key: app
            value: backend
    description: Association for production EKS cluster
    region: us-west-1
    tags:
      Environment: production
      Name: example
    type: EKS
---
apiVersion: eks.aws.m.upbound.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: networkfirewall/v1beta1/containerassociation
    uptest.upbound.io/timeout: "2400"
  name: sample-eks-cluster
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    roleArnRef:
      name: sample-eks-cluster
    vpcConfig:
      subnetIdRefs:
        - name: sample-subnet1
        - name: sample-subnet2
---
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: networkfirewall/v1beta1/containerassociation
  name: sample-eks-cluster
  namespace: upbound-system
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "eks.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }
---
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: networkfirewall/v1beta1/containerassociation
  name: sample-cluster-policy
  namespace: upbound-system
spec:
  forProvider:
    policyArn: arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
    roleRef:
      name: sample-eks-cluster
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: networkfirewall/v1beta1/containerassociation
  name: sample-subnet1
  namespace: upbound-system
spec:
  forProvider:
    availabilityZone: us-west-1b
    cidrBlock: 172.16.10.0/24
    mapPublicIpOnLaunch: true
    region: us-west-1
    vpcIdRef:
      name: sample-vpc
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: networkfirewall/v1beta1/containerassociation
  name: sample-subnet2
  namespace: upbound-system
spec:
  forProvider:
    availabilityZone: us-west-1a
    cidrBlock: 172.16.11.0/24
    mapPublicIpOnLaunch: true
    region: us-west-1
    vpcIdRef:
      name: sample-vpc
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: networkfirewall/v1beta1/containerassociation
  name: sample-vpc
  namespace: upbound-system
spec:
  forProvider:
    cidrBlock: 172.16.0.0/16
    enableDnsHostnames: true
    region: us-west-1
    tags:
      Name: DemoVpc
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: InternetGateway
metadata:
  annotations:
    meta.upbound.io/example-id: networkfirewall/v1beta1/containerassociation
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    vpcIdRef:
      name: sample-vpc
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: DefaultRouteTable
metadata:
  annotations:
    meta.upbound.io/example-id: networkfirewall/v1beta1/containerassociation
  name: example
  namespace: upbound-system
spec:
  forProvider:
    defaultRouteTableIdRef:
      name: sample-vpc
    region: us-west-1
    route:
      - cidrBlock: 0.0.0.0/0
        gatewayIdRef:
          name: example
