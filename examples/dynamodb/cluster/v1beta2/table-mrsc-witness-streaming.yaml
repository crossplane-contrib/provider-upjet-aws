# MRSC "2 replicas + 1 witness" topology with Streams; the witness holds
# replicated data but is not readable/writable and has no stream.
apiVersion: dynamodb.aws.upbound.io/v1beta2
kind: Table
metadata:
  annotations:
    meta.upbound.io/example-id: dynamodb/v1beta2/table
    uptest.upbound.io/timeout: "1200"
  name: example-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    region: us-east-1
    billingMode: PAY_PER_REQUEST
    hashKey: id
    attribute:
    - name: id
      type: S
    streamEnabled: true
    streamViewType: NEW_AND_OLD_IMAGES
    replica:
    - regionName: us-west-2
      consistencyMode: STRONG
    globalTableWitness:
      regionName: us-east-2
