apiVersion: servicediscovery.aws.m.upbound.io/v1beta1
kind: PrivateDNSNamespace
metadata:
  annotations:
    meta.upbound.io/example-id: servicediscovery/v1beta1/privatednsnamespace
  name: example
  namespace: upbound-system
spec:
  forProvider:
    name: example
    region: us-west-1
    description: example
    vpcRef:
      name: sample-vpc

---

apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: servicediscovery/v1beta1/privatednsnamespace
  name: sample-vpc
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 172.16.0.0/16
    enableDnsHostnames: true
    enableDnsSupport: true
    tags:
      Name: DemoVpc
