apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: TableReplication
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablereplication
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-2
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    rule:
    - destination:
      - destinationTableBucketArnSelector:
          matchLabels:
            testing.upbound.io/example-name: target
    tableArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: iam.aws.m.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablereplication
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Action": "sts:AssumeRole",
            "Effect": "Allow",
            "Principal": {
              "Service": "s3tables.amazonaws.com"
            }
          }
        ]
      }
    inlinePolicy:
    - name: s3tables-replication
      policy: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3tables:*"
              ],
              "Resource": "*"
            }
          ]
        }

---

apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: Table
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablereplication
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    format: ICEBERG
    name: example_table
    namespaceSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    region: us-west-2
    tableBucketArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: S3TablesNamespace
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablereplication
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    namespace: example_namespace
    region: us-west-2
    tableBucketArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: TableBucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablereplication
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    name: example-bucket
    region: us-west-2

---

apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: TableBucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablereplication
  labels:
    testing.upbound.io/example-name: target
  name: target
  namespace: upbound-system
spec:
  forProvider:
    name: target-bucket
    region: us-west-2
