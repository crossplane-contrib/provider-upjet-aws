apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: TableBucketReplication
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablebucketreplication
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-2
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    rule:
    - destination:
      - destinationTableBucketArnSelector:
          matchLabels:
            testing.upbound.io/example-name: target
    tableBucketArnSelector:
      matchLabels:
        testing.upbound.io/example-name: source

---

apiVersion: iam.aws.m.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablebucketreplication
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Action": "sts:AssumeRole",
            "Effect": "Allow",
            "Principal": {
              "Service": "s3tables.amazonaws.com"
            }
          }
        ]
      }
    inlinePolicy:
    - name: s3tables-replication
      policy: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3tables:*"
              ],
              "Resource": "*"
            }
          ]
        }

---

apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: TableBucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablebucketreplication
  labels:
    testing.upbound.io/example-name: source
  name: source
  namespace: upbound-system
spec:
  forProvider:
    name: source-${Rand.RFC1123Subdomain}
    region: us-west-2

---

apiVersion: s3tables.aws.m.upbound.io/v1beta1
kind: TableBucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/tablebucketreplication
  labels:
    testing.upbound.io/example-name: target
  name: target
  namespace: upbound-system
spec:
  forProvider:
    name: target-${Rand.RFC1123Subdomain}
    region: us-west-2
