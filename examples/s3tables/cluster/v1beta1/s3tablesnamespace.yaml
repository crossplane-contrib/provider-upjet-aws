apiVersion: s3tables.aws.upbound.io/v1beta1
kind: S3TablesNamespace
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/s3tablesnamespace
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    namespace: example
    region: us-west-2
    tableBucketArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: s3tables.aws.upbound.io/v1beta1
kind: TableBucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3tables/v1beta1/s3tablesnamespace
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: example-${Rand.RFC1123Subdomain}
    region: us-west-2
