apiVersion: bedrockagentcore.aws.upbound.io/v1beta1
kind: Evaluator
metadata:
  annotations:
    meta.upbound.io/example-id: bedrockagentcore/v1beta1/evaluator
  labels:
    testing.upbound.io/example-name: evaluator
  name: evaluator
spec:
  forProvider:
    region: us-west-2
    evaluatorName: helpfulness_evaluator
    description: Rates assistant helpfulness from 1 to 5
    level: TRACE
    evaluatorConfig:
      llmAsAJudge:
        instructionsSecretRef:
          key: instructions
          name: evaluator-instructions
          namespace: upbound-system
        modelConfig:
          bedrockEvaluatorModelConfig:
            modelId: "us.amazon.nova-2-lite-v1:0"
            inferenceConfig:
              maxTokens: 1024
              temperature: 0
              topP: 1
        ratingScale:
          numerical:
          - definition: Not helpful at all.
            value: 1
            label: "1"
          - definition: Extremely helpful.
            value: 5
            label: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: evaluator-instructions
  namespace: upbound-system
  labels:
    testing.upbound.io/example-name: evaluator
  annotations:
    meta.upbound.io/example-id: bedrockagentcore/v1beta1/evaluator
stringData:
  instructions: "Given the {context} and the {assistant_turn}, compare against {expected_response} and rate from 1 to 5."
