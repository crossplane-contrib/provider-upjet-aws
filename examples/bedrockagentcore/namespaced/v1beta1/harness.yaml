# Basic Harness Example
# Creates a Bedrock AgentCore Harness, a managed agent loop wrapping a Bedrock
# model and a system prompt. The system prompt text is sensitive and supplied
# through a Kubernetes Secret reference. An IAM execution role is included.

apiVersion: bedrockagentcore.aws.m.upbound.io/v1beta1
kind: Harness
metadata:
  annotations:
    meta.upbound.io/example-id: bedrockagentcore/v1beta1/harness
  labels:
    testing.upbound.io/example-name: harness
  name: harness
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-2
    harnessName: uptest_example_harness
    executionRoleArnSelector:
      matchLabels:
        testing.upbound.io/example-name: harness
    model:
      bedrockModelConfig:
        modelId: anthropic.claude-sonnet-4-20250514
    systemPrompt:
    - textSecretRef:
        key: text
        name: harness-system-prompt
    memory:
      agentcoreMemoryConfiguration:
        arnRef:
          name: example-memory-for-harness
---
apiVersion: bedrockagentcore.aws.m.upbound.io/v1beta1
kind: Memory
metadata:
  annotations:
    meta.upbound.io/example-id: bedrockagentcore/v1beta1/harness
  labels:
    testing.upbound.io/example-name: harness
  name: example-memory-for-harness
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-2
    name: uptest_example_memory_harness
    description: Memory for agent interactions - Uptest example for Harness
    eventExpiryDuration: 30
    tags:
      Environment: dev
---
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: bedrockagentcore/v1beta1/harness
  labels:
    testing.upbound.io/example-name: harness
  name: bedrock-agentcore-harness-role
  namespace: upbound-system
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {"Service": "bedrock-agentcore.amazonaws.com"},
            "Action": "sts:AssumeRole"
          }
        ]
      }
---
apiVersion: v1
kind: Secret
metadata:
  name: harness-system-prompt
  namespace: upbound-system
  labels:
    testing.upbound.io/example-name: harness
  annotations:
    meta.upbound.io/example-id: bedrockagentcore/v1beta1/harness
stringData:
  text: "You are a helpful assistant."
