apiVersion: s3.aws.m.upbound.io/v1beta1
kind: BucketWebsiteConfiguration
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketwebsiteconfiguration
  name: example
  namespace: upbound-system
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: s3
    errorDocument:
      key: error.html
    indexDocument:
      suffix: index.html
    region: us-west-1
    routingRule:
      - condition:
          keyPrefixEquals: docs/
        redirect:
          replaceKeyPrefixWith: documents/

---

apiVersion: s3.aws.m.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketwebsiteconfiguration
  labels:
    testing.upbound.io/example-name: s3
  name: s3-${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
