apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketRequestPaymentConfiguration
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketrequestpaymentconfiguration
  name: example
spec:
  forProvider:
    region: us-west-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: s3
    payer: Requester

---

apiVersion: s3.aws.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketrequestpaymentconfiguration
  labels:
    testing.upbound.io/example-name: s3
  name: s3-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    region: us-west-1
