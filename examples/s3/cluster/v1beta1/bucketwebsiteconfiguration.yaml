apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketWebsiteConfiguration
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketwebsiteconfiguration
  name: example
spec:
  forProvider:
    region: us-west-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: s3
    errorDocument:
    - key: error.html
    indexDocument:
    - suffix: index.html
    routingRule:
    - condition:
      - keyPrefixEquals: docs/
      redirect:
      - replaceKeyPrefixWith: documents/

---

apiVersion: s3.aws.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketwebsiteconfiguration
  labels:
    testing.upbound.io/example-name: s3
  name: s3-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    region: us-west-1
