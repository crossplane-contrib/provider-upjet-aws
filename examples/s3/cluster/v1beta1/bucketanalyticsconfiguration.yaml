apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketAnalyticsConfiguration
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketanalyticsconfiguration
  name: example
spec:
  forProvider:
    region: us-west-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: s3
    name: EntireBucket
    storageClassAnalysis:
    - dataExport:
      - destination:
        - s3BucketDestination:
          - bucketArnSelector:
              matchLabels:
                testing.upbound.io/example-name: s3

---

apiVersion: s3.aws.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketanalyticsconfiguration
  labels:
    testing.upbound.io/example-name: s3
  name: s3-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    region: us-west-1
