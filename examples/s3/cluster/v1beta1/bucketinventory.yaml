apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketInventory
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketinventory
  name: example
spec:
  forProvider:
    region: us-west-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: s3
    destination:
    - bucket:
      - bucketArnSelector:
          matchLabels:
            testing.upbound.io/example-name: s3-2
        format: ORC
    includedObjectVersions: All
    name: EntireBucketDaily
    schedule:
    - frequency: Daily

---

apiVersion: s3.aws.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketinventory
  labels:
    testing.upbound.io/example-name: s3
  name: s3-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    region: us-west-1

---

apiVersion: s3.aws.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3/v1beta1/bucketinventory
  labels:
    testing.upbound.io/example-name: s3-2
  name: s3-2-${Rand.RFC1123Subdomain}
spec:
  forProvider:
    region: us-west-1
