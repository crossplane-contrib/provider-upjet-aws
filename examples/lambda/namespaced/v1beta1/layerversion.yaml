apiVersion: lambda.aws.m.upbound.io/v1beta1
kind: LayerVersion
metadata:
  annotations:
    meta.upbound.io/example-id: lambda/v1beta1/layerversion
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-east-1
    compatibleRuntimes:
      - python3.9
    layerName: example-layer-permission
    s3Bucket: official-provider-test-data
    s3Key: hello-python.zip
