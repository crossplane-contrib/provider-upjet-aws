apiVersion: lambda.aws.upbound.io/v1beta1
kind: LayerVersionPermission
metadata:
  annotations:
    meta.upbound.io/example-id: lambda/v1beta1/layerversionpermission
  name: example
spec:
  forProvider:
    region: us-east-1
    action: lambda:GetLayerVersion
    principal: "*"
    statementId: dev-account
    layerNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    versionNumberSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: lambda.aws.upbound.io/v1beta1
kind: LayerVersion
metadata:
  annotations:
    meta.upbound.io/example-id: lambda/v1beta1/layerversionpermission
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    region: us-east-1
    compatibleRuntimes:
    - python3.9
    layerName: example-layer-permission
    s3Bucket: official-provider-test-data
    s3Key: hello-python.zip
