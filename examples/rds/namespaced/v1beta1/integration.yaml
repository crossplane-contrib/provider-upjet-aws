apiVersion: rds.aws.m.upbound.io/v1beta1
kind: Integration
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
    uptest.upbound.io/timeout: "3600"
  labels:
    testing.upbound.io/example-name: example
  name: example-${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    dataFilter: "include: mydb.*.*"
    integrationName: example
    region: us-west-1
    sourceArnRef:
      name: example-integration-source
    targetArnRef:
      name: example-namespace-${Rand.RFC1123Subdomain}
---
apiVersion: rds.aws.m.upbound.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
  labels:
    testing.upbound.io/example-name: example-integration-source
  name: example-integration-source
  namespace: upbound-system
spec:
  forProvider:
    autoGeneratePassword: true
    databaseName: mydb
    dbClusterParameterGroupNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example-integration-source
    engine: aurora-postgresql
    masterPasswordSecretRef:
      key: password
      name: sample-cluster-password
    masterUsername: cpadmin
    region: us-west-1
    skipFinalSnapshot: true
---
apiVersion: rds.aws.m.upbound.io/v1beta1
kind: ClusterParameterGroup
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
  labels:
    testing.upbound.io/example-name: example-integration-source
  name: example-integration-source
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    description: Aurora PostgreSQL cluster parameter group enabling enhanced logical replication for zero-ETL
    family: aurora-postgresql17
    parameter:
      - name: rds.logical_replication
        value: "1"
        applyMethod: pending-reboot
      - name: aurora.enhanced_logical_replication
        value: "1"
        applyMethod: pending-reboot
      - name: aurora.logical_replication_backup
        value: "0"
        applyMethod: pending-reboot
      - name: aurora.logical_replication_globaldb
        value: "0"
        applyMethod: pending-reboot
---
apiVersion: rds.aws.m.upbound.io/v1beta1
kind: ClusterInstance
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
  labels:
    testing.upbound.io/example-name: example-integration-source
  name: example-integration-source
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    clusterIdentifierRef:
      name: example-integration-source
    engine: aurora-postgresql
    instanceClass: db.r5.large
---
apiVersion: redshift.aws.m.upbound.io/v1beta1
kind: ResourcePolicy
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
  labels:
    testing.upbound.io/example-name: example
  name: example-resourcepolicy-${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    resourceArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example-namespace
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "EnableCreationAndManagementOfRDSIntegration",
            "Effect": "Allow",
            "Principal": {
              "AWS": "arn:aws:iam::${data.aws_account_id}:root"
            },
            "Action": [
              "redshift:CreateInboundIntegration"
            ]
          },
          {
            "Sid": "EnableCreationOfInboundIntegration",
            "Effect": "Allow",
            "Principal": {
              "Service": "redshift.amazonaws.com"
            },
            "Action": [
              "redshift:AuthorizeInboundIntegration"
            ],
            "Condition": {
              "StringEquals": {
                "aws:SourceArn": "arn:aws:rds:us-west-1:${data.aws_account_id}:cluster:example-integration-source"
              }
            }
          }
        ]
      }
---
apiVersion: redshiftserverless.aws.m.upbound.io/v1beta1
kind: RedshiftServerlessNamespace
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
  labels:
    testing.upbound.io/example-name: example-namespace
  name: example-namespace-${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
---
apiVersion: redshiftserverless.aws.m.upbound.io/v1beta1
kind: Workgroup
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
  labels:
    testing.upbound.io/example-name: example
  name: example-workgroup-${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    baseCapacity: 8
    configParameter:
    - parameterKey: enable_case_sensitive_identifier
      parameterValue: "true"
    namespaceName: example-namespace-${Rand.RFC1123Subdomain}
    publiclyAccessible: false
    region: us-west-1
    subnetIdRefs:
    - name: example1
    - name: example2
    - name: example3
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
  labels:
    testing.upbound.io/example-name: example
  name: example-vpc-${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    cidrBlock: 10.0.0.0/16
    region: us-west-1
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
  labels:
    testing.upbound.io/example-name: example1
  name: example1
  namespace: upbound-system
spec:
  forProvider:
    availabilityZone: us-west-1a
    cidrBlock: 10.0.1.0/24
    region: us-west-1
    vpcIdRef:
      name: example-vpc-${Rand.RFC1123Subdomain}
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
  labels:
    testing.upbound.io/example-name: example2
  name: example2
  namespace: upbound-system
spec:
  forProvider:
    availabilityZone: us-west-1b
    cidrBlock: 10.0.2.0/24
    region: us-west-1
    vpcIdRef:
      name: example-vpc-${Rand.RFC1123Subdomain}
---
apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: rds/v1beta1/integration
  labels:
    testing.upbound.io/example-name: example3
  name: example3
  namespace: upbound-system
spec:
  forProvider:
    availabilityZone: us-west-1c
    cidrBlock: 10.0.3.0/24
    region: us-west-1
    vpcIdRef:
      name: example-vpc-${Rand.RFC1123Subdomain}
