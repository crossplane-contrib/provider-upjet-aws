apiVersion: secretsmanager.aws.upbound.io/v1beta1
kind: SecretPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretpolicy
  labels:
    testing.upbound.io/example-name: secretsmanager
  name: example
spec:
  forProvider:
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "EnableAnotherAWSAccountToReadTheSecret",
            "Effect": "Allow",
            "Principal": {
              "AWS": "arn:aws:iam::${data.aws_account_id}:root"
            },
            "Action": "secretsmanager:GetSecretValue",
            "Resource": "*"
          }
        ]
      }
    region: us-west-1
    secretArnSelector:
      matchLabels:
        testing.upbound.io/example-name: secretsmanager

---

apiVersion: secretsmanager.aws.upbound.io/v1beta1
kind: Secret
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretpolicy
  labels:
    testing.upbound.io/example-name: secretsmanager
  name: example-secret
spec:
  forProvider:
    name: example-${Rand.RFC1123Subdomain}
    region: us-west-1
    recoveryWindowInDays: 0
