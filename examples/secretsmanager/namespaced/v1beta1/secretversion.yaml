apiVersion: secretsmanager.aws.m.upbound.io/v1beta1
kind: SecretVersion
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretversion
  name: example
  labels:
    testing.upbound.io/example-name: secretsmanager
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    secretIdSelector:
      matchLabels:
        testing.upbound.io/example-name: secretsmanager
    secretStringSecretRef:
      key: mystery
      name: example-secret-version
---
apiVersion: v1
kind: Secret
metadata:
  name: example-secret-version
  namespace: upbound-system
type: Opaque
stringData:
  mystery: "dummysecretdata"

---

apiVersion: secretsmanager.aws.m.upbound.io/v1beta1
kind: Secret
metadata:
  annotations:
    meta.upbound.io/example-id: secretsmanager/v1beta1/secretversion
  labels:
    testing.upbound.io/example-name: secretsmanager
  name: example-secret
  namespace: upbound-system
spec:
  forProvider:
    name: example-${Rand.RFC1123Subdomain}
    region: us-west-1
    recoveryWindowInDays: 0
