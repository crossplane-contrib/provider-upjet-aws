apiVersion: neptune.aws.m.upbound.io/v1beta1
kind: EventSubscription
metadata:
  annotations:
    meta.upbound.io/example-id: neptune/v1beta1/eventsubscription
  name: sample-event-sub
  namespace: upbound-system
spec:
  forProvider:
    region: eu-central-1
    snsTopicArnRef:
      name: sample-neptune-topic
    tags:
      env: test
---
apiVersion: sns.aws.m.upbound.io/v1beta1
kind: Topic
metadata:
  annotations:
    crossplane.io/external-name: "sample-neptune-topic"
    meta.upbound.io/example-id: neptune/v1beta1/eventsubscription
  name: sample-neptune-topic
  namespace: upbound-system
spec:
  forProvider:
    region: eu-central-1
