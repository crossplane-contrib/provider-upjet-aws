apiVersion: oam.aws.m.upbound.io/v1beta1
kind: Sink
metadata:
  annotations:
    meta.upbound.io/example-id: oam/v1beta1/sinkpolicy
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    name: ExampleSink
    region: us-west-1

---

apiVersion: oam.aws.m.upbound.io/v1beta1
kind: SinkPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: oam/v1beta1/sinkpolicy
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {"AWS": "${data.aws_account_id}"},
            "Action": ["oam:CreateLink", "oam:UpdateLink"],
            "Resource": "*",
            "Condition": {
              "ForAllValues:StringEquals": {
                "oam:ResourceTypes": ["AWS::Logs::LogGroup"]
              }
            }
          }
        ]
      }
    region: us-west-1
    sinkIdentifierSelector:
      matchLabels:
        testing.upbound.io/example-name: example
