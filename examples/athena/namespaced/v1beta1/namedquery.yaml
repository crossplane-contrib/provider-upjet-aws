apiVersion: athena.aws.m.upbound.io/v1beta1
kind: NamedQuery
metadata:
  annotations:
    meta.upbound.io/example-id: athena/v1beta1/namedquery
  labels:
    testing.upbound.io/example-name: foo
  name: foo
  namespace: upbound-system
spec:
  forProvider:
    databaseSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    name: bar
    query: SELECT * FROM example limit 10;
    region: us-west-1
    workgroupSelector:
      matchLabels:
        testing.upbound.io/example-name: test

---

apiVersion: athena.aws.m.upbound.io/v1beta1
kind: Database
metadata:
  annotations:
    meta.upbound.io/example-id: athena/v1beta1/namedquery
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: upbound-example
    region: us-west-1

---

apiVersion: s3.aws.m.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: athena/v1beta1/namedquery
  labels:
    testing.upbound.io/example-name: upbound-example
  name: ${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    forceDestroy: true

---

apiVersion: athena.aws.m.upbound.io/v1beta1
kind: Workgroup
metadata:
  annotations:
    meta.upbound.io/example-id: athena/v1beta1/namedquery
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: upbound-system
spec:
  forProvider:
    configuration:
      resultConfiguration:
        encryptionConfiguration:
          encryptionOption: SSE_KMS
          kmsKeyArnSelector:
            matchLabels:
              testing.upbound.io/example-name: test
        outputLocation: s3://upbound-example/output/
    region: us-west-1

---

apiVersion: kms.aws.m.upbound.io/v1beta1
kind: Key
metadata:
  annotations:
    meta.upbound.io/example-id: athena/v1beta1/namedquery
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: upbound-system
spec:
  forProvider:
    deletionWindowInDays: 7
    description: Athena KMS Key
    region: us-west-1
