apiVersion: sesv2.aws.m.upbound.io/v1beta1
kind: TenantResourceAssociation
metadata:
  annotations:
    meta.upbound.io/example-id: sesv2/v1beta1/tenantresourceassociation
  labels:
    testing.upbound.io/example-name: example-association
  name: example-association
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    resourceArn: arn:aws:ses:us-west-1:${data.aws_account_id}:identity/v2-example@example.com
    tenantNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example-association
---
apiVersion: sesv2.aws.m.upbound.io/v1beta1
kind: Tenant
metadata:
  annotations:
    meta.upbound.io/example-id: sesv2/v1beta1/tenantresourceassociation
  labels:
    testing.upbound.io/example-name: example-association
  name: example-association-tenant
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    tenantName: example-association-tenant
---
apiVersion: sesv2.aws.m.upbound.io/v1beta1
kind: EmailIdentity
metadata:
  annotations:
    meta.upbound.io/example-id: sesv2/v1beta1/tenantresourceassociation
    crossplane.io/external-name: v2-example@example.com
  labels:
    testing.upbound.io/example-name: example-association
  name: example-association-identity
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
