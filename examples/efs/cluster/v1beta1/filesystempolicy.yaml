apiVersion: efs.aws.upbound.io/v1beta1
kind: FileSystemPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: efs/v1beta1/filesystempolicy
  labels:
    testing.upbound.io/example-name: filesystempolicy
  name: filesystempolicy
spec:
  forProvider:
    bypassPolicyLockoutSafetyCheck: true
    fileSystemIdSelector:
      matchLabels:
        testing.upbound.io/example-name: filesystempolicy
    policy: |
      {
          "Version": "2012-10-17",
          "Id": "ExamplePolicy01",
          "Statement": [
              {
                  "Sid": "ExampleStatement01",
                  "Effect": "Allow",
                  "Principal": {
                      "AWS": "*"
                  },
                  "Action": [
                      "elasticfilesystem:ClientMount",
                      "elasticfilesystem:ClientWrite"
                  ],
                  "Condition": {
                      "Bool": {
                          "aws:SecureTransport": "true"
                      }
                  }
              }
          ]
      }
    region: us-west-1
---
apiVersion: efs.aws.upbound.io/v1beta1
kind: FileSystem
metadata:
  annotations:
    meta.upbound.io/example-id: efs/v1beta1/filesystempolicy
  labels:
    testing.upbound.io/example-name: filesystempolicy
  name: filesystempolicy
spec:
  forProvider:
    creationToken: filesystempolicy
    region: us-west-1
