apiVersion: kafka.aws.m.upbound.io/v1beta1
kind: Configuration
metadata:
  annotations:
    meta.upbound.io/example-id: kafka/v1beta1/configuration
  name: example
  namespace: upbound-system
spec:
  forProvider:
    kafkaVersions:
      - 2.1.0
    name: example
    region: us-west-1
    serverProperties: |
      auto.create.topics.enable = true
      delete.topic.enable = true
