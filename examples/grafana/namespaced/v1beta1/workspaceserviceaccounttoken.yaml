apiVersion: grafana.aws.m.upbound.io/v1beta1
kind: WorkspaceServiceAccountToken
metadata:
  annotations:
    meta.upbound.io/example-id: grafana/v1beta1/workspaceserviceaccounttoken
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    name: example-key
    region: us-east-1
    secondsToLive: 3600
    serviceAccountIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-sa
    workspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-ws

---

apiVersion: grafana.aws.m.upbound.io/v1beta1
kind: WorkspaceServiceAccount
metadata:
  annotations:
    meta.upbound.io/example-id: grafana/v1beta1/workspaceserviceaccounttoken
  labels:
    testing.upbound.io/example-name: example-sa
  name: example-sa
  namespace: upbound-system
spec:
  forProvider:
    grafanaRole: ADMIN
    name: example-admin
    region: us-east-1
    workspaceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example-ws

---

apiVersion: grafana.aws.m.upbound.io/v1beta1
kind: Workspace
metadata:
  annotations:
    meta.upbound.io/example-id: grafana/v1beta1/workspaceserviceaccounttoken
  labels:
    testing.upbound.io/example-name: example-ws
  name: example-${Rand.RFC1123Subdomain}
  namespace: upbound-system
spec:
  forProvider:
    accountAccessType: CURRENT_ACCOUNT
    authenticationProviders:
      - AWS_SSO
    permissionType: SERVICE_MANAGED
    region: us-east-1
    roleArnSelector:
      matchLabels:
        testing.upbound.io/example-name: assume-ws

---

apiVersion: iam.aws.m.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: grafana/v1beta1/workspaceserviceaccounttoken
  labels:
    testing.upbound.io/example-name: assume-ws
  name: assume-ws
  namespace: upbound-system
spec:
  forProvider:
    assumeRolePolicy: |-
      ${jsonencode({
          Version = "2012-10-17"
          Statement = [
            {
              Action = "sts:AssumeRole"
              Effect = "Allow"
              Sid    = ""
              Principal = {
                Service = "grafana.amazonaws.com"
              }
            },
          ]
        })}
