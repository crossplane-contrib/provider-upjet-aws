# Model Invocation Logging Configuration Example
# Delivers the model invocation logs of the region to a CloudWatch log group.
# There is a single logging configuration per region.

apiVersion: bedrock.aws.m.upbound.io/v1beta1
kind: ModelInvocationLoggingConfiguration
metadata:
  annotations:
    meta.upbound.io/example-id: bedrock/v1beta1/modelinvocationloggingconfiguration
  labels:
    testing.upbound.io/example-name: modelinvocationloggingconfiguration
  name: modelinvocationloggingconfiguration
  namespace: upbound-system
spec:
  forProvider:
    loggingConfig:
      cloudwatchConfig:
        logGroupNameSelector:
          matchLabels:
            testing.upbound.io/example-name: modelinvocationloggingconfiguration
        roleArnSelector:
          matchLabels:
            testing.upbound.io/example-name: modelinvocationloggingconfiguration
      embeddingDataDeliveryEnabled: true
      imageDataDeliveryEnabled: true
      textDataDeliveryEnabled: true
      videoDataDeliveryEnabled: true
    region: us-east-1

---

apiVersion: cloudwatchlogs.aws.m.upbound.io/v1beta1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: bedrock/v1beta1/modelinvocationloggingconfiguration
  labels:
    testing.upbound.io/example-name: modelinvocationloggingconfiguration
  name: example-bedrock-modelinvocationlogging
  namespace: upbound-system
spec:
  forProvider:
    region: us-east-1
    retentionInDays: 1

---

apiVersion: iam.aws.m.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: bedrock/v1beta1/modelinvocationloggingconfiguration
  labels:
    testing.upbound.io/example-name: modelinvocationloggingconfiguration
  name: example-bedrock-modelinvocationlogging
  namespace: upbound-system
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "bedrock.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }

---

apiVersion: iam.aws.m.upbound.io/v1beta1
kind: RolePolicy
metadata:
  annotations:
    meta.upbound.io/example-id: bedrock/v1beta1/modelinvocationloggingconfiguration
  labels:
    testing.upbound.io/example-name: modelinvocationloggingconfiguration
  name: example-bedrock-modelinvocationlogging
  namespace: upbound-system
spec:
  forProvider:
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "logs:CreateLogStream",
              "logs:PutLogEvents"
            ],
            "Resource": "*"
          }
        ]
      }
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: modelinvocationloggingconfiguration
