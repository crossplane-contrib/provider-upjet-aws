# Provisioned Model Throughput Example
# Purchases Provisioned Throughput without a commitment for a foundation model.

apiVersion: bedrock.aws.upbound.io/v1beta1
kind: ProvisionedModelThroughput
metadata:
  annotations:
    meta.upbound.io/example-id: bedrock/v1beta1/provisionedmodelthroughput
    upjet.upbound.io/manual-intervention: >
      Provisioned Throughput is billed per hour for every model unit and
      needs a service quota for the model units.
  labels:
    testing.upbound.io/example-name: provisionedmodelthroughput
  name: provisionedmodelthroughput
spec:
  forProvider:
    modelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0:128k
    modelUnits: 1
    provisionedModelName: example-provisioned-model
    region: us-east-1
