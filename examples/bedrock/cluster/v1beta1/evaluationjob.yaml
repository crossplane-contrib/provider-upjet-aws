# Evaluation Job Example
# Evaluates a foundation model with a built-in dataset and stores the results
# in an S3 bucket.

apiVersion: bedrock.aws.upbound.io/v1beta1
kind: EvaluationJob
metadata:
  annotations:
    meta.upbound.io/example-id: bedrock/v1beta1/evaluationjob
    upjet.upbound.io/manual-intervention: >
      An evaluation job invokes the evaluated model for every prompt of the
      dataset, which is billed and can run for hours.
  labels:
    testing.upbound.io/example-name: evaluationjob
  name: evaluationjob
spec:
  forProvider:
    evaluationConfig:
      automated:
        datasetMetricConfig:
          - dataset:
              name: Builtin.Bold
            metricNames:
              - Builtin.Robustness
            taskType: Generation
    inferenceConfig:
      model:
        - bedrockModel:
            modelIdentifier: amazon.nova-micro-v1:0
    jobName: example-evaluation-job
    outputDataConfig:
      s3Uri: s3://upbound-example-bedrock-evaluationjob/output/
    region: us-east-1
    roleArnSelector:
      matchLabels:
        testing.upbound.io/example-name: evaluationjob

---

apiVersion: s3.aws.upbound.io/v1beta2
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: bedrock/v1beta1/evaluationjob
    upjet.upbound.io/manual-intervention: >
      An evaluation job invokes the evaluated model for every prompt of the
      dataset, which is billed and can run for hours.
  labels:
    testing.upbound.io/example-name: evaluationjob
  name: upbound-example-bedrock-evaluationjob
spec:
  forProvider:
    forceDestroy: true
    region: us-east-1

---

apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: bedrock/v1beta1/evaluationjob
    upjet.upbound.io/manual-intervention: >
      An evaluation job invokes the evaluated model for every prompt of the
      dataset, which is billed and can run for hours.
  labels:
    testing.upbound.io/example-name: evaluationjob
  name: example-bedrock-evaluationjob
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "bedrock.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }

---

apiVersion: iam.aws.upbound.io/v1beta1
kind: RolePolicy
metadata:
  annotations:
    meta.upbound.io/example-id: bedrock/v1beta1/evaluationjob
    upjet.upbound.io/manual-intervention: >
      An evaluation job invokes the evaluated model for every prompt of the
      dataset, which is billed and can run for hours.
  labels:
    testing.upbound.io/example-name: evaluationjob
  name: example-bedrock-evaluationjob
spec:
  forProvider:
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "bedrock:InvokeModel"
            ],
            "Resource": "*"
          },
          {
            "Effect": "Allow",
            "Action": [
              "s3:GetObject",
              "s3:PutObject",
              "s3:ListBucket"
            ],
            "Resource": [
              "arn:aws:s3:::upbound-example-bedrock-evaluationjob",
              "arn:aws:s3:::upbound-example-bedrock-evaluationjob/*"
            ]
          }
        ]
      }
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: evaluationjob
