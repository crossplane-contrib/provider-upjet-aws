apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: TransitGatewayMulticastGroupMember
metadata:
  annotations:
    meta.upbound.io/example-id: ec2/v1beta1/transitgatewaymulticastgroupmember
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    groupIpAddress: 224.0.0.1
    networkInterfaceIdRef:
      name: sample-ni
    region: us-west-1
    transitGatewayMulticastDomainIdRef:
      name: domain

---

apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: NetworkInterface
metadata:
  annotations:
    meta.upbound.io/example-id: ec2/v1beta1/transitgatewaymulticastgroupmember
  name: sample-ni
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    subnetIdRef:
      name: sample-subnet1
    privateIps:
      - "172.16.10.100"

---

apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: TransitGatewayMulticastDomain
metadata:
  annotations:
    meta.upbound.io/example-id: ec2/v1beta1/transitgatewaymulticastgroupmember
  labels:
    testing.upbound.io/example-name: domain
  name: domain
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    staticSourcesSupport: enable
    tags:
      Name: Transit_Gateway_Multicast_Domain_Example
    transitGatewayIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: TransitGatewayMulticastDomainAssociation
metadata:
  annotations:
    meta.upbound.io/example-id: ec2/v1beta1/transitgatewaymulticastgroupmember
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    subnetIdRef:
      name: sample-subnet1
    transitGatewayAttachmentIdRef:
      name: example
    transitGatewayMulticastDomainIdRef:
      name: domain

---

apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: TransitGatewayVPCAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: ec2/v1beta1/transitgatewaymulticastgroupmember
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    subnetIdRefs:
    - name: sample-subnet1
    transitGatewayIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    vpcIdRef:
      name: sample-vpc

---

apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: TransitGateway
metadata:
  annotations:
    meta.upbound.io/example-id: ec2/v1beta1/transitgatewaymulticastgroupmember
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    multicastSupport: enable

---

apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: ec2/v1beta1/transitgatewaymulticastgroupmember
  name: sample-subnet1
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    availabilityZone: us-west-1b
    vpcIdRef:
      name: sample-vpc
    cidrBlock: 172.16.10.0/24

---

apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: ec2/v1beta1/transitgatewaymulticastgroupmember
  name: sample-vpc
  namespace: upbound-system
spec:
  forProvider:
    region: us-west-1
    cidrBlock: 172.16.0.0/16
    tags:
      Name: DemoVpc
