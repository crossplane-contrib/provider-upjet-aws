apiVersion: s3files.aws.upbound.io/v1beta1
kind: FileSystemPolicy
metadata:
  annotations:
    meta.upbound.io/example-id: s3files/v1beta1/filesystempolicy
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    region: us-east-1
    fileSystemIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "AWS": "*"
            },
            "Action": "s3files:ClientMount",
            "Resource": "*"
          }
        ]
      }

---

apiVersion: s3files.aws.upbound.io/v1beta1
kind: FileSystem
metadata:
  annotations:
    meta.upbound.io/example-id: s3files/v1beta1/filesystempolicy
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    region: us-east-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    roleArnSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: s3.aws.upbound.io/v1beta2
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: s3files/v1beta1/filesystempolicy
  labels:
    testing.upbound.io/example-name: example
  name: ${Rand.RFC1123Subdomain}
spec:
  forProvider:
    region: us-east-1

---

apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: s3files/v1beta1/filesystempolicy
  labels:
    testing.upbound.io/example-name: example
  name: s3files-example-role
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "AllowS3FilesAssumeRole",
            "Effect": "Allow",
            "Principal": {
              "Service": "elasticfilesystem.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }

---

apiVersion: iam.aws.upbound.io/v1beta1
kind: RolePolicy
metadata:
  annotations:
    meta.upbound.io/example-id: s3files/v1beta1/filesystempolicy
  labels:
    testing.upbound.io/example-name: example
  name: s3files-example-role-policy
spec:
  forProvider:
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "S3BucketPermissions",
            "Effect": "Allow",
            "Action": [
              "s3:ListBucket",
              "s3:ListBucketVersions"
            ],
            "Resource": "*"
          },
          {
            "Sid": "S3ObjectPermissions",
            "Effect": "Allow",
            "Action": [
              "s3:AbortMultipartUpload",
              "s3:DeleteObject*",
              "s3:GetObject*",
              "s3:List*",
              "s3:PutObject*"
            ],
            "Resource": "*"
          },
          {
            "Sid": "UseKmsKeyWithS3Files",
            "Effect": "Allow",
            "Action": [
              "kms:GenerateDataKey",
              "kms:Encrypt",
              "kms:Decrypt",
              "kms:ReEncryptFrom",
              "kms:ReEncryptTo"
            ],
            "Resource": "*",
            "Condition": {
              "StringLike": {
                "kms:ViaService": "s3.us-east-1.amazonaws.com"
              }
            }
          },
          {
            "Sid": "EventBridgeManage",
            "Effect": "Allow",
            "Action": [
              "events:DeleteRule",
              "events:DisableRule",
              "events:EnableRule",
              "events:PutRule",
              "events:PutTargets",
              "events:RemoveTargets"
            ],
            "Resource": [
              "arn:aws:events:*:*:rule/DO-NOT-DELETE-S3-Files*"
            ],
            "Condition": {
              "StringEquals": {
                "events:ManagedBy": "elasticfilesystem.amazonaws.com"
              }
            }
          },
          {
            "Sid": "EventBridgeRead",
            "Effect": "Allow",
            "Action": [
              "events:DescribeRule",
              "events:ListRuleNamesByTarget",
              "events:ListRules",
              "events:ListTargetsByRule"
            ],
            "Resource": [
              "arn:aws:events:*:*:rule/*"
            ]
          }
        ]
      }
    roleSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: s3.aws.upbound.io/v1beta2
kind: BucketVersioning
metadata:
  annotations:
    meta.upbound.io/example-id: s3files/v1beta1/filesystempolicy
  labels:
    testing.upbound.io/example-name: versioning_example
  name: versioning-example
spec:
  forProvider:
    region: us-east-1
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    versioningConfiguration:
      status: Enabled
