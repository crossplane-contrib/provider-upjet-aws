apiVersion: globalaccelerator.aws.m.upbound.io/v1beta1
kind: EndpointGroup
metadata:
  annotations:
    meta.upbound.io/example-id: globalaccelerator/v1beta1/endpointgroup
  name: sample-endpoint-group
  namespace: upbound-system
spec:
  forProvider:
    listenerArnRef:
      name: sample-listener
  writeConnectionSecretToRef:
    name: endpoint

---

apiVersion: globalaccelerator.aws.m.upbound.io/v1beta1
kind: Listener
metadata:
  annotations:
    meta.upbound.io/example-id: globalaccelerator/v1beta1/endpointgroup
  name: sample-listener
  namespace: upbound-system
spec:
  forProvider:
    acceleratorArnRef:
      name: sample-accelerator
    clientAffinity: "SOURCE_IP"
    protocol: "TCP"
    portRange:
      - fromPort: 80
        toPort: 80
  writeConnectionSecretToRef:
    name: listener

---

apiVersion: globalaccelerator.aws.m.upbound.io/v1beta1
kind: Accelerator
metadata:
  annotations:
    meta.upbound.io/example-id: globalaccelerator/v1beta1/endpointgroup
  name: sample-accelerator
  namespace: upbound-system
spec:
  forProvider:
    ipAddressType: IPV4
    name: sample-accelerator
  writeConnectionSecretToRef:
    name: accelerator
